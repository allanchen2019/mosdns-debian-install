api:
  http: "127.0.0.1:9080"

log:
  level: info
  file: "/var/log/mosdns/mosdns.log"

plugins:
# 1. 按分流路径隔离缓存，避免域名规则变化或错误上游答案跨路径复用。
- tag: "local_cache"
  type: cache
  args:
    size: 8192
    lazy_cache_ttl: 7200
    dump_file: "./cache-local.dump"
    dump_interval: 600

- tag: "remote_cache"
  type: cache
  args:
    size: 8192
    lazy_cache_ttl: 3600
    dump_file: "./cache-remote.dump"
    dump_interval: 600

- tag: "fallback_cache"
  type: cache
  args:
    size: 4096
    lazy_cache_ttl: 1800
    dump_file: "./cache-fallback.dump"
    dump_interval: 600

# 2. 域名集合
- tag: "direct_domain"
  type: domain_set
  args:
    files:
    - "./china-list.txt"
    - "./apple-cn.txt"
    - "./direct-domain.txt"
    - "./geosite_steam.txt"
    - "./geosite_nintendo.txt"
    - "./geosite_playstation.txt"
    - "./geosite_epicgames.txt"
    - "./geosite_blizzard.txt"
    - "./geosite_ea.txt"
    - "./geosite_riot.txt"
    - "./geosite_roblox.txt"
    - "./geosite_tencent-games.txt"
    - "./geosite_mihoyo-cn.txt"
    - "./geosite_bilibili-game.txt"
    - "./geosite_category-games-other.txt"

- tag: "remote_domain"
  type: domain_set
  args:
    files:
    - "./proxy-list.txt"

- tag: "custom_iot_domain"
  type: domain_set
  args:
    files:
    - "./custom-iot.txt"

- tag: "local_domain"
  type: domain_set
  args:
    files:
    - "./local-domain.txt"

# 3. IP 集合
- tag: "cn_ip"
  type: ip_set
  args:
    files:
    - "./cn_ipv4.txt"
    - "./cn_ipv6.txt"

# 4. 上游转发
- tag: "router_forward"
  type: forward
  args:
    concurrent: 1
    upstreams:
    - addr: "192.168.4.1"

- tag: "local_forward"
  type: forward
  args:
    concurrent: 2
    upstreams:
    - addr: "119.29.29.29"
    - addr: "223.5.5.5"

- tag: "iot_forward"
  type: forward
  args:
    concurrent: 2
    upstreams:
    - addr: "114.114.114.114"
    - addr: "114.114.115.115"

- tag: "remote_forward"
  type: forward
  args:
    # 每次只选择一个加密上游；失败/超时由下方独立 DoH 通道接管，
    # 避免每个查询常态同时发送给多个解析商。
    concurrent: 1
    upstreams:
    - addr: "tls://cloudflare-dns.com:853"
      dial_addr: "1.1.1.1:853"
      tag: "cloudflare_dot"
      enable_pipeline: true
    - addr: "tls://dns.google:853"
      dial_addr: "8.8.8.8:853"
      tag: "google_dot"
      enable_pipeline: true

# 独立的 HTTPS/443 加密备用通道，避免 DoT/853 受 QoS 干扰时回落到国内明文 DNS。
- tag: "remote_doh_forward"
  type: forward
  args:
    concurrent: 1
    upstreams:
    - addr: "https://cloudflare-dns.com/dns-query"
      dial_addr: "1.1.1.1:443"
      tag: "cloudflare_doh"
    - addr: "https://dns.google/dns-query"
      dial_addr: "8.8.8.8:443"
      tag: "google_doh"

# 5. 安全兜底策略
# 海外域名只允许在加密上游之间切换，绝不回落到会受污染的国内明文 DNS。
- tag: "remote_fallback_strategy"
  type: fallback
  args:
    primary: remote_forward
    secondary: remote_doh_forward
    threshold: 500
    # 不常态并发备用查询：主通道失败或超过阈值时才启动 DoH。
    always_standby: false

# 6. ECS 处理器 (避免内网私有 IP 作为 ECS 导致公网 CDN GSLB 异常调度)
- tag: "ecs_domestic"
  type: "ecs_handler"
  args:
    forward: false
    send: false

- tag: "ecs_remote"
  type: "ecs_handler"
  args:
    forward: false
    send: false

# ---------------- 逻辑序列 ----------------

- tag: "local_router_sequence"
  type: sequence
  args:
  # 1. 环路防止：若反查属于 192.168.0.0/16 且客户端是 ROS 本身 (192.168.4.1)，说明本地未命中已回源，直接秒回 NXDOMAIN
  - matches:
    - "qtype 12"
    - "qname 168.192.in-addr.arpa."
    - "client_ip 192.168.4.1 ::ffff:192.168.4.1"
    exec: reject 3
  - matches:
    - "qtype 12"
    - "qname 168.192.in-addr.arpa."
    - "client_ip 192.168.4.1 ::ffff:192.168.4.1"
    exec: query_summary [loop_prevented_nxdomain]
  - matches:
    - "qtype 12"
    - "qname 168.192.in-addr.arpa."
    - "client_ip 192.168.4.1 ::ffff:192.168.4.1"
    exec: return

  # 2. 私有 IP 墙：直接拦截并拒绝除了 192.168.0.0/16 以外的其他私有反向解析（如 10.x.x.x, 172.16.x.x 等）
  - matches:
    - "qtype 12"
    - "qname 10.in-addr.arpa. 16.172.in-addr.arpa. 17.172.in-addr.arpa. 18.172.in-addr.arpa. 19.172.in-addr.arpa. 20.172.in-addr.arpa. 21.172.in-addr.arpa. 22.172.in-addr.arpa. 23.172.in-addr.arpa. 24.172.in-addr.arpa. 25.172.in-addr.arpa. 26.172.in-addr.arpa. 27.172.in-addr.arpa. 28.172.in-addr.arpa. 29.172.in-addr.arpa. 30.172.in-addr.arpa. 31.172.in-addr.arpa."
    exec: reject 3
  - matches:
    - "qtype 12"
    - "qname 10.in-addr.arpa. 16.172.in-addr.arpa. 17.172.in-addr.arpa. 18.172.in-addr.arpa. 19.172.in-addr.arpa. 20.172.in-addr.arpa. 21.172.in-addr.arpa. 22.172.in-addr.arpa. 23.172.in-addr.arpa. 24.172.in-addr.arpa. 25.172.in-addr.arpa. 26.172.in-addr.arpa. 27.172.in-addr.arpa. 28.172.in-addr.arpa. 29.172.in-addr.arpa. 30.172.in-addr.arpa. 31.172.in-addr.arpa."
    exec: query_summary [other_private_ptr_reject]
  - matches:
    - "qtype 12"
    - "qname 10.in-addr.arpa. 16.172.in-addr.arpa. 17.172.in-addr.arpa. 18.172.in-addr.arpa. 19.172.in-addr.arpa. 20.172.in-addr.arpa. 21.172.in-addr.arpa. 22.172.in-addr.arpa. 23.172.in-addr.arpa. 24.172.in-addr.arpa. 25.172.in-addr.arpa. 26.172.in-addr.arpa. 27.172.in-addr.arpa. 28.172.in-addr.arpa. 29.172.in-addr.arpa. 30.172.in-addr.arpa. 31.172.in-addr.arpa."
    exec: return

  # 3. 正常转发：将正向 A 记录或未命中的 192.168.0.0/16 网段首次 PTR 查询转发给 ROS
  - exec: $router_forward
  - exec: query_summary [router_hit]
  - exec: return

- tag: "local_sequence"
  type: sequence
  args:
  - exec: $local_cache
  - matches: has_resp
    exec: query_summary [local_cache_hit]
  - matches: has_resp
    exec: accept
  - exec: $ecs_domestic
  - exec: $local_forward
  - exec: query_summary [local_hit]
  - exec: return

- tag: "iot_sequence"
  type: sequence
  args:
  - exec: $ecs_domestic
  - exec: $iot_forward
  - exec: query_summary [iot_hit]
  - exec: return

- tag: "remote_sequence"
  type: sequence
  args:
  - exec: $remote_cache
  - matches: has_resp
    exec: query_summary [remote_cache_hit]
  - matches: has_resp
    exec: accept
  - exec: $ecs_remote
  - exec: $remote_fallback_strategy
  - exec: query_summary [remote_hit_resilient]
  - exec: return

- tag: "fallback_sequence"
  type: sequence
  args:
  - exec: $fallback_cache
  - matches: has_resp
    exec: query_summary [fallback_cache_hit]
  - matches: has_resp
    exec: accept
  - exec: $ecs_domestic
  - exec: $local_forward
  - matches: "resp_ip $cn_ip"
    exec: query_summary [fallback_cn_hit]
  - matches: "resp_ip $cn_ip"
    exec: accept
  - exec: query_summary [fallback_remote_trial]
  - exec: drop_resp
  - exec: $ecs_remote
  - exec: $remote_fallback_strategy
  - exec: query_summary [fallback_remote_final_resilient]
  - exec: return

- tag: "main_sequence"
  type: sequence
  args:
  - matches: "qtype 12"
    exec: goto local_router_sequence

  - matches: "qname $local_domain"
    exec: goto local_router_sequence

  - matches: "qname $custom_iot_domain"
    exec: goto iot_sequence

  - matches: "qname $remote_domain"
    exec: goto remote_sequence

  - matches: "qname $direct_domain"
    exec: goto local_sequence

  - exec: goto fallback_sequence

# ---------------- 服务器监听 ----------------
- type: udp_server
  args:
    entry: main_sequence
    listen: :53

- type: tcp_server
  args:
    entry: main_sequence
    listen: :53
